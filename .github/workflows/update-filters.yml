name: Update & Merge Filter Lists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run merge script
        run: python merge_filters.py

      - name: Commit and push generated lists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update tiered filter lists"
          # Commits generated lists including the standalone pornlist.
          # extra.txt (your custom rules) stays untouched.
          file_pattern: "persianshield-*.txt pornlist.txt"
          branch: main
