name: Update & Merge Filter Lists

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write # Required for the auto-commit action to push changes

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run merge script
        run: python merge_filters.py

      - name: Commit and push generated lists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update merged filter lists"
          file_pattern: "persianshield-*.txt" # Only commits the generated lists, protecting extra.txt
          branch: main # Change this if your default branch is named 'master'
