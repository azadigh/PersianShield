name: Update & Merge Filter Lists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run merge script
        run: python merge_filters.py
      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update filter lists + stats"
          file_pattern: "persianshield-*.txt persianshield-dns-* pornlist.txt stats.json"
          branch: main
