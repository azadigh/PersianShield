name: Update & Merge Filter Lists

on:
  # Runs automatically every day at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # Required to push the updated lists back

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run merge script
        run: python merge_filters.py

      - name: Commit and push generated lists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update tiered filter lists"
          # Only commit the generated output files.
          # This protects extra.txt (your custom rules) from being overwritten.
          file_pattern: "persianshield-*.txt"
          branch: main
